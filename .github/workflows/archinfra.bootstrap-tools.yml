name: Archinfra Cache Bootstrap Tools

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/archinfra.bootstrap-tools.yml
      - .github/scripts/tools
      - common

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  REPOSITORY: archinfra/cache

jobs:
  tools:
    name: tools-${{ matrix.arch }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        arch:
          - amd64
          - arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push tools cache
        env:
          ARCH: ${{ matrix.arch }}
          REGISTRY: ${{ env.REGISTRY }}
          REPOSITORY: ${{ env.REPOSITORY }}
        run: bash .github/scripts/tools

      - name: Verify published image
        run: docker buildx imagetools inspect "${REGISTRY}/${REPOSITORY}:tools-${{ matrix.arch }}"
